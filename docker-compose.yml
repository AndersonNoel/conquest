services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:3000"   # Cloudflare connects to port 80; the app listens on 3000 inside
    environment:
      - NODE_ENV=production
      - PORT=3000
      # SESSION_SECRET is loaded from the .env file on the host (see .env.example)
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      # Bind-mount data and uploads from the host so they survive container
      # rebuilds and updates.
      - ./data:/app/data
      - ./uploads:/app/uploads
