<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Capture</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .join-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(ellipse at 50% 0%, #1e2d1e 0%, var(--bg) 70%);
    }

    .join-box {
      width: 100%;
      max-width: 400px;
    }

    .join-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .join-logo-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 8px;
    }

    .join-logo-title {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .join-name-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-input);
      border: 2px solid var(--border-light);
      border-radius: var(--radius);
      color: var(--text);
      padding: 14px 18px;
      font-size: 1.1rem;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      text-align: center;
      letter-spacing: 0.04em;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }

    .join-name-input:focus { border-color: var(--primary); }

    .join-name-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
      letter-spacing: 0;
    }

    .join-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      margin-top: 4px;
      border-radius: var(--radius);
      background: var(--primary);
      border: none;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s;
    }

    .join-btn:hover  { background: var(--primary-hover); transform: translateY(-1px); }
    .join-btn:active { transform: translateY(0); }
    .join-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .join-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .join-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .join-footer a:hover { text-decoration: underline; }

    .admin-link-wrap {
      margin-top: 32px;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .admin-link {
      color: var(--text-dim);
      font-size: 0.82rem;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }

    .admin-link:hover { color: var(--text-muted); }
  </style>
</head>
<body class="join-page">
  <div class="join-box">

    <div class="join-logo">
      <span class="join-logo-icon">&#9876;</span>
      <div class="join-logo-title">Capture</div>
    </div>

    <div id="alert-box"></div>

    <form id="login-form">
      <input class="join-name-input" type="text" id="username"
             placeholder="Name..." autocomplete="username"
             maxlength="30" autocorrect="off" autocapitalize="words" required>
      <input class="join-name-input" type="password" id="password"
             placeholder="Password..." autocomplete="current-password"
             maxlength="100" required>
      <button type="submit" class="join-btn" id="login-btn">Log In</button>
    </form>

    <div class="join-footer">
      <a href="/register">Sign up &rsaquo;</a>
    </div>

    <div class="admin-link-wrap">
      <a class="admin-link" href="/admin">Admin panel &rsaquo;</a>
    </div>

  </div>

  <script>
    const alertBox = document.getElementById('alert-box');
    const loginBtn = document.getElementById('login-btn');

    if (window.innerWidth > 600) document.getElementById('username').focus();

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      alertBox.innerHTML = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return;

      loginBtn.disabled    = true;
      loginBtn.textContent = 'Logging in...';

      const res  = await fetch('/api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        window.location.href = data.redirect || '/dashboard';
        return;
      }

      loginBtn.disabled    = false;
      loginBtn.textContent = 'Log In';

      // On 404, hint that the name doesn't exist and they should sign up.
      if (res.status === 404) {
        alertBox.innerHTML = `<div class="alert alert-error">
          Name not found. <a href="/register" style="color:inherit;font-weight:700">Sign up</a> to create an account.
        </div>`;
      } else {
        alertBox.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
      }
    });
  </script>
</body>
</html>
